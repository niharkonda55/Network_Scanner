{% extends 'base.html' %}

{% block content %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.css" rel="stylesheet" type="text/css" />

<h1 class="text-3xl font-bold text-gray-800 mb-8">Devices on Network</h1>

<div class="bg-white p-6 rounded-lg shadow-lg mb-8">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Network Device Discovery</h2>
    <div class="space-y-4">
        <div class="flex items-center space-x-4">
            <label for="interface-select-devices" class="font-medium text-gray-700">Select Interface:</label>
            <select id="interface-select-devices" class="form-select block w-auto px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <option value="">Loading interfaces...</option>
                <!-- Options will be dynamically loaded by JavaScript -->
            </select>
        </div>
        <div>
            <label for="ip-range-input" class="block text-lg font-medium text-gray-700 mb-1">Manual IP Range (Optional, e.g., 192.168.1.0/24):</label>
            <input type="text" id="ip-range-input" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Leave empty to auto-detect subnet">
            <p class="text-sm text-gray-500 mt-1">If left empty, the subnet of the selected interface will be used for scanning.</p>
        </div>
        <button id="scan-devices-btn" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-md shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 ease-in-out" disabled>Scan Network for Devices (ARP)</button>
        <div id="scan-status" class="mt-4 text-center text-gray-700"></div>
    </div>
</div>

<div class="bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Discovered Devices Map</h2>
    <div id="network-map" style="height: 600px; border: 1px solid #e2e8f0; border-radius: 0.5rem;"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
<script src="{{ url_for('static', filename='js/network_map.js') }}"></script>
{% endblock %}
